# THE GATE (2026-08-01 architecture pass): a red suite reached the live box
# because a human piped pytest and lost its exit code. Machines don't pipe.
# Every push to main and every pull request runs the full suite. The data
# branches (reads: the daily reads, ~15 pushes a day; odds: the server's
# hourly Betfair pushes) carry no code and are not tested: running the suite
# on them used 90% of the account's Actions minutes by 30 Oct.
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the box's venv (docs/DEPLOY: python3.11) and
                                   # pyproject's requires-python — audit 2026-09-02
                                   # found CI on 3.10 testing a version the package
                                   # declares unsupported
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=src python -m pytest tests/ -q
